<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","live","leads","projects","study","settings"],"default":"home"},"$preview":{"width":240,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const base = 'display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 8px; text-decoration: none; font-weight: 600; color: #475569;';
    const on = 'display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 8px; text-decoration: none; font-weight: 700; color: #0F172A; background: #FFFFFF; box-shadow: 0 0 0 1px #E2E8F0, 0 1px 2px rgba(15,23,42,.05);';
    const studyBase = 'display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 13px; color: #334155;';
    const studyOn = studyBase + ' background: #FFFFFF; box-shadow: 0 0 0 1px #E2E8F0; color: #0F172A; font-weight: 700;';
    const gearBase = 'margin-left: auto; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #64748B; text-decoration: none; flex-shrink: 0;';
    const gearOn = gearBase + ' background: #FFFFFF; box-shadow: 0 0 0 1px #E2E8F0; color: #0F172A;';
    const nav = {};
    ['home', 'live', 'leads', 'projects'].forEach((k) => { nav[k] = k === active ? on : base; });
    nav.study = active === 'study' ? studyOn : studyBase;
    nav.settings = active === 'settings' ? gearOn : gearBase;
    return { nav };
  }
}
</script>
