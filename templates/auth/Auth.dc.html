<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Auth — Sign up / Log in" description="Birdsong admin auth: brand-warm centered card with bobbing bird, sign-up and log-in modes, password reveal, terms footnote" -->
<helmet>
<script src="./ds-base.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Spectral:ital,wght@1,400;1,500&family=Inter:ital,wght@0,400;0,500;0,600;1,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ecdf;--surface:#fffdf7;--ink:#241f18;--muted:#6f6757;--faint:#a89d88;--border:#e7ddc9;--green:#3a6046;--green-bg:#e4ecdd;--blue:#54749e;--blue-bg:#e4ebf4;--sans:'Inter',ui-sans-serif,system-ui,sans-serif;--disp:'Bricolage Grotesque','Inter',ui-sans-serif,system-ui,sans-serif}
[data-tone="eggshell"]{--bg:#faf8f1;--surface:#fffefa;--border:#e9e3d3}
html,body{margin:0;padding:0;background:var(--bg)}
a{color:var(--ink);text-decoration:none}a:hover{color:var(--green)}
input::placeholder{color:var(--faint)}
input:focus{outline:none;border-color:var(--faint);box-shadow:0 0 0 3px rgba(58,96,70,.1)}
[data-reveal]{opacity:0;transform:translateY(16px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.rv-in[data-reveal]{opacity:1;transform:none}
@keyframes bob{0%,84%,100%{transform:none}88%{transform:translateY(-2px) rotate(-4deg)}93%{transform:translateY(0) rotate(2.5deg)}97%{transform:none}}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(0deg)}33%{transform:translate(9px,-14px) rotate(5deg)}66%{transform:translate(-7px,-6px) rotate(-4deg)}}
@keyframes noteLoopA{0%,52%,100%{opacity:0;transform:none}58%{opacity:.85}74%{opacity:0;transform:translateY(-26px)}}
@keyframes noteLoopB{0%,62%,100%{opacity:0;transform:none}68%{opacity:.85}84%{opacity:0;transform:translateY(-24px)}}
[data-motion="off"] *{animation:none !important}
[data-motion="off"] [data-reveal]{opacity:1;transform:none;transition:none}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}[data-reveal]{opacity:1 !important;transform:none !important}}
</style>
</helmet>
<div data-tone="{{ tone }}" data-motion="{{ motionAttr }}" style="background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden">
<div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;overflow:hidden;background:radial-gradient(760px 420px at 24% -8%,rgba(58,96,70,.09),transparent 60%),radial-gradient(760px 420px at 76% -10%,rgba(84,116,158,.09),transparent 60%)">
<div style="position:absolute;top:-80px;left:6%;width:300px;height:300px;border-radius:50%;background:var(--green-bg);opacity:.5;filter:blur(70px);animation:drift 14s ease-in-out infinite"></div>
<div style="position:absolute;top:-60px;right:5%;width:280px;height:280px;border-radius:50%;background:var(--blue-bg);opacity:.55;filter:blur(70px);animation:drift 17s ease-in-out 2s infinite reverse"></div>
<span style="position:absolute;top:16%;left:13%;font-size:19px;color:var(--green);opacity:.4;animation:drift 9s ease-in-out infinite">&#9834;</span>
<span style="position:absolute;top:11%;right:17%;font-size:16px;color:var(--blue);opacity:.4;animation:drift 11s ease-in-out 1.2s infinite">&#9835;</span>
<span style="position:absolute;top:68%;right:8%;font-size:14px;color:var(--faint);opacity:.45;animation:drift 13s ease-in-out .6s infinite">&#9834;</span>
<span style="position:absolute;top:74%;left:10%;font-size:16px;color:var(--green);opacity:.35;animation:drift 12s ease-in-out 2s infinite">&#9835;</span>
</div>
<header data-reveal="1" style="position:relative;padding:26px 36px">
<a href="#" style="display:inline-flex;align-items:center;gap:10px">
<svg width="22" height="20" viewBox="0 0 48 44" fill="none" style="animation:bob 6s ease infinite"><path d="M10 40 L19.5 28.5 C11.5 27.5 5.5 21.5 5.5 13.5 C5.5 9.5 7.5 5.5 10.5 4.5 C11.5 10.5 16.5 13.5 22.5 13.5 C31.5 13.5 38.5 19.5 38.5 27.5 C38.5 29 38.2 30.4 37.6 31.8 L44.5 34.5 L36.5 35 C33.5 38.5 28.5 40.5 23 40.5 L14.5 40.5 Z" fill="var(--ink)"></path><circle cx="33" cy="25.5" r="1.8" fill="var(--bg)"></circle></svg>
<span style="font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:-.01em">Birdsong</span>
</a>
</header>
<main data-screen-label="Auth" style="flex:1;display:flex;align-items:flex-start;justify-content:center;padding:28px 24px 64px;position:relative">
<div style="width:100%;max-width:430px;display:flex;flex-direction:column;align-items:center">
<div aria-hidden="true" data-reveal="1" style="position:relative;width:120px;height:64px;margin-bottom:6px">
<span style="position:absolute;top:0;left:26px;font-size:16px;color:var(--green);opacity:0;animation:noteLoopA 7s ease infinite">&#9834;</span>
<span style="position:absolute;top:14px;left:66px;font-size:13px;color:var(--faint);opacity:0;animation:noteLoopB 7s ease 1s infinite">&#9835;</span>
<svg width="40" height="37" viewBox="0 0 48 44" fill="none" style="position:absolute;left:40px;bottom:0;animation:bob 6s ease infinite"><path d="M10 40 L19.5 28.5 C11.5 27.5 5.5 21.5 5.5 13.5 C5.5 9.5 7.5 5.5 10.5 4.5 C11.5 10.5 16.5 13.5 22.5 13.5 C31.5 13.5 38.5 19.5 38.5 27.5 C38.5 29 38.2 30.4 37.6 31.8 L44.5 34.5 L36.5 35 C33.5 38.5 28.5 40.5 23 40.5 L14.5 40.5 Z" fill="var(--ink)"></path><circle cx="33" cy="25.5" r="1.8" fill="var(--bg)"></circle></svg>
</div>
<h1 data-reveal="1" style="transition-delay:.06s;font-family:var(--disp);font-weight:700;font-size:36px;line-height:1.08;letter-spacing:-.02em;margin:0 0 10px;text-align:center;text-wrap:balance">{{ heading }}</h1>
<div data-reveal="1" style="transition-delay:.1s;font-size:15px;color:var(--muted);margin-bottom:28px;text-align:center">{{ subcopy }}</div>
<div data-reveal="1" style="transition-delay:.16s;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:32px 34px 30px;box-shadow:0 4px 14px rgba(38,32,25,.06);box-sizing:border-box">
<div style="display:flex;flex-direction:column;gap:16px">
<sc-if value="{{ isSignup }}" hint-placeholder-val="{{ true }}">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div style="display:flex;flex-direction:column;gap:6px"><label for="bs-fn" style="font-size:13px;font-weight:600;color:var(--muted)">First name</label><input id="bs-fn" placeholder="Ada" style="width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--border);border-radius:11px;padding:12px 14px;font-size:15px;font-family:inherit;color:var(--ink);transition:border-color .16s ease,box-shadow .16s ease"></div>
<div style="display:flex;flex-direction:column;gap:6px"><label for="bs-ln" style="font-size:13px;font-weight:600;color:var(--muted)">Last name</label><input id="bs-ln" placeholder="Lark" style="width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--border);border-radius:11px;padding:12px 14px;font-size:15px;font-family:inherit;color:var(--ink);transition:border-color .16s ease,box-shadow .16s ease"></div>
</div>
</sc-if>
<div style="display:flex;flex-direction:column;gap:6px"><label for="bs-em" style="font-size:13px;font-weight:600;color:var(--muted)">Work email</label><input id="bs-em" type="email" placeholder="you@company.com" style="width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--border);border-radius:11px;padding:12px 14px;font-size:15px;font-family:inherit;color:var(--ink);transition:border-color .16s ease,box-shadow .16s ease"></div>
<div style="display:flex;flex-direction:column;gap:6px">
<div style="display:flex;align-items:baseline;justify-content:space-between"><label for="bs-pw" style="font-size:13px;font-weight:600;color:var(--muted)">Password</label><sc-if value="{{ isLogin }}" hint-placeholder-val="{{ false }}"><a href="#" style="font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px">Forgot your password?</a></sc-if></div>
<div style="position:relative">
<input id="bs-pw" type="{{ pwType }}" placeholder="{{ pwPlaceholder }}" style="width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--border);border-radius:11px;padding:12px 44px 12px 14px;font-size:15px;font-family:inherit;color:var(--ink);transition:border-color .16s ease,box-shadow .16s ease">
<button type="button" onClick="{{ togglePw }}" aria-label="Show password" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:8px;color:var(--faint);display:flex" style-hover="color:var(--muted)">
<sc-if value="{{ pwHidden }}" hint-placeholder-val="{{ true }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.6"></circle></svg></sc-if>
<sc-if value="{{ pwShown }}" hint-placeholder-val="{{ false }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.6"></circle><path d="M4 4l16 16"></path></svg></sc-if>
</button>
</div>
<sc-if value="{{ isSignup }}" hint-placeholder-val="{{ true }}"><div style="font-size:12.5px;color:var(--faint)">At least 8 characters.</div></sc-if>
</div>
<button style="width:100%;background:var(--ink);color:var(--bg);border:none;border-radius:999px;padding:15px 24px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:6px;transition:transform .25s ease,box-shadow .25s ease" style-hover="transform:translateY(-2px);box-shadow:0 14px 30px rgba(38,32,25,.18)">{{ ctaLabel }}</button>
</div>
<sc-if value="{{ isSignup }}" hint-placeholder-val="{{ true }}">
<div style="margin-top:16px;font-size:12.5px;color:var(--faint);text-align:center;line-height:1.55">By creating an account, you agree to our <a href="#" style="color:var(--muted);text-decoration:underline;text-underline-offset:3px">Terms</a> and <a href="#" style="color:var(--muted);text-decoration:underline;text-underline-offset:3px">Privacy Policy</a>.</div>
</sc-if>
</div>
<div data-reveal="1" style="transition-delay:.24s;margin-top:22px;font-size:14.5px;color:var(--muted)">{{ switchPrompt }} <a href="#" onClick="{{ switchMode }}" style="font-weight:600;text-decoration:underline;text-underline-offset:3px">{{ switchLabel }}</a></div>
</div>
</main>
<footer data-reveal="1" style="transition-delay:.3s;position:relative;padding:20px 32px 30px;display:flex;align-items:center;justify-content:center;gap:18px;font-size:13px;color:var(--faint)">
<span>&copy; 2026 Birdsong</span><a href="#" style="color:var(--faint)" style-hover="color:var(--muted)">Terms</a><a href="#" style="color:var(--faint)" style-hover="color:var(--muted)">Privacy</a><a href="#" style="color:var(--faint)" style-hover="color:var(--muted)">Help</a>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;screen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;signup&quot;,&quot;options&quot;:[&quot;signup&quot;,&quot;login&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Screen&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;eggshell&quot;,&quot;options&quot;:[&quot;cream&quot;,&quot;eggshell&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;animations&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;}}">
class Component extends DCLogic {
  state = { mode: null, showPw: false };
  _reveal() {
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.querySelectorAll('[data-reveal]:not(.rv-in)').forEach(el => el.classList.add('rv-in'));
    }));
  }
  componentDidMount() { this._reveal(); }
  componentDidUpdate() { this._reveal(); }
  renderVals() {
    const mode = this.state.mode ?? this.props.screen ?? 'signup';
    const isSignup = mode === 'signup';
    const showPw = this.state.showPw;
    return {
      tone: this.props.tone ?? 'eggshell',
      motionAttr: (this.props.animations ?? true) ? 'on' : 'off',
      isSignup, isLogin: !isSignup,
      heading: isSignup ? 'Start listening to your market' : 'Welcome back',
      subcopy: isSignup ? 'Create your account and launch your first interview in minutes.' : 'Log in to your Birdsong account.',
      ctaLabel: isSignup ? 'Create account' : 'Log in',
      switchPrompt: isSignup ? 'Already have an account?' : 'New to Birdsong?',
      switchLabel: isSignup ? 'Log in' : 'Create an account',
      switchMode: (e) => { e.preventDefault(); this.setState({ mode: isSignup ? 'login' : 'signup', showPw: false }); },
      pwType: showPw ? 'text' : 'password',
      pwHidden: !showPw, pwShown: showPw,
      pwPlaceholder: isSignup ? 'Choose a password' : 'Your password',
      togglePw: () => this.setState(s => ({ showPw: !s.showPw }))
    };
  }
}
</script>
</body>
</html>
