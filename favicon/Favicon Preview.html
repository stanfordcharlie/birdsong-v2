<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Birdsong Favicon</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#faf8f1;font-family:'Bricolage Grotesque',sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}
.row{display:flex;gap:48px;align-items:flex-end}
.opt{display:flex;flex-direction:column;align-items:center;gap:14px}
.tile{width:128px;height:128px;border-radius:28px;display:flex;align-items:center;justify-content:center}
.tile span{font-weight:700;font-size:92px;line-height:1;transform:translateY(-3px)}
.lbl{font-family:Inter,sans-serif;font-size:13px;color:#6f6757}
.mini{display:flex;gap:10px;align-items:center}
.mini .tile{border-radius:7px}
</style>
</head>
<body>
<div class="row">
<div class="opt"><div class="tile" id="fav-ink" style="background:#241f18"><span style="color:#faf8f1">B</span></div><div class="lbl">Ink · primary</div>
<div class="mini"><div class="tile" style="background:#241f18;width:32px;height:32px"><span style="color:#faf8f1;font-size:23px;transform:translateY(-1px)">B</span></div><div class="tile" style="background:#241f18;width:16px;height:16px;border-radius:4px"><span style="color:#faf8f1;font-size:12px;transform:translateY(0)">B</span></div></div></div>
<div class="opt"><div class="tile" id="fav-green" style="background:#3a6046"><span style="color:#faf8f1">B</span></div><div class="lbl">Green</div>
<div class="mini"><div class="tile" style="background:#3a6046;width:32px;height:32px"><span style="color:#faf8f1;font-size:23px;transform:translateY(-1px)">B</span></div><div class="tile" style="background:#3a6046;width:16px;height:16px;border-radius:4px"><span style="color:#faf8f1;font-size:12px;transform:translateY(0)">B</span></div></div></div>
<div class="opt"><div class="tile" id="fav-cream" style="background:#f3ecdf"><span style="color:#241f18">B</span></div><div class="lbl">Cream · ink B</div>
<div class="mini"><div class="tile" style="background:#f3ecdf;width:32px;height:32px"><span style="color:#241f18;font-size:23px;transform:translateY(-1px)">B</span></div><div class="tile" style="background:#f3ecdf;width:16px;height:16px;border-radius:4px"><span style="color:#241f18;font-size:12px;transform:translateY(0)">B</span></div></div></div>
</div>
</body>
</html>
